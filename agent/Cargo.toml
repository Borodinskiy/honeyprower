[package]
name = "honeyforge-agent"
version = "0.1.0"
edition = "2021"
description = "HoneyForge low-interaction honeypot agent (one-way telemetry to the center)"

[[bin]]
name = "honeyforge-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.47.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal", "process"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
ureq = { version = "2.12.1", features = ["tls"] }
regex = "1.11.1"
base64 = "0.22.1"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
zeroize = "1.8"
flate2 = "1.0"
rand = "0.8"
socket2 = "0.5"
hex = "0.4"
libc = "0.2"
russh = { version = "0.64.1", default-features = false, features = ["ring", "flate2"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
