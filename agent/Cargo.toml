[package]
name = "honeyforge-agent"
version = "0.1.0"
edition = "2021"
description = "HoneyForge low-interaction honeypot agent (one-way telemetry to the center)"

[[bin]]
name = "honeyforge-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.47.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
ureq = { version = "2.12.1", features = ["tls"] }
regex = "1.11.1"
base64 = "0.22.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
