<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Noto Sans, Arial, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b5f9e"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <style>
      .box{fill:#fff;stroke:#c9ced6;stroke-width:1.5}
      .t{font-size:22px;font-weight:700;fill:#1f2328}
      .s{font-size:16px;fill:#57606a}
      .l{font-size:15px;font-weight:600}
      .n{font-size:14px;font-weight:700;fill:#fff}
      .chip{fill:#eef3fa;stroke:#b9cbe4}
      .own{fill:#fff6e5;stroke:#e0b45c}
      .c{font-size:14px;fill:#1f2328}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#fff"/>
  <text x="40" y="70" font-size="32" font-weight="700" fill="#1f2328">Как работает HoneyForge</text>

  <!-- Оператор -->
  <rect class="box" x="40" y="320" width="180" height="100" rx="8"/>
  <text x="130" y="364" class="t" text-anchor="middle">Оператор</text>
  <text x="130" y="392" class="s" text-anchor="middle">браузер</text>
  <line x1="222" y1="370" x2="358" y2="370" stroke="#2b5f9e" stroke-width="2.5" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <circle cx="290" cy="340" r="13" fill="#2b5f9e"/><text x="290" y="345" class="n" text-anchor="middle">1</text>
  <circle cx="290" cy="400" r="13" fill="#2b5f9e"/><text x="290" y="405" class="n" text-anchor="middle">5</text>

  <!-- БД -->
  <path d="M40,500 a90,14 0 0 0 180,0 a90,14 0 0 0 -180,0 v80 a90,14 0 0 0 180,0 v-80" fill="#fff" stroke="#c9ced6" stroke-width="1.5"/>
  <text x="130" y="548" class="l" text-anchor="middle" fill="#1f2328">PostgreSQL</text>
  <text x="130" y="572" class="c" text-anchor="middle" fill="#57606a">события</text>
  <line x1="222" y1="545" x2="358" y2="545" stroke="#2b5f9e" stroke-width="2" marker-start="url(#ab)" marker-end="url(#ab)"/>

  <!-- Центр -->
  <rect class="box" x="360" y="150" width="300" height="540" rx="8" stroke="#2b5f9e" stroke-width="2"/>
  <text x="510" y="390" class="t" text-anchor="middle">Центр</text>
  <text x="510" y="420" class="s" text-anchor="middle">Go</text>
  <text x="510" y="452" class="s" text-anchor="middle">сайт и API, развёртывание,</text>
  <text x="510" y="476" class="s" text-anchor="middle">приём событий</text>

  <!-- Атакующий -->
  <rect class="box" x="1360" y="370" width="200" height="100" rx="8" stroke="#e3a29d"/>
  <text x="1460" y="414" class="t" text-anchor="middle" fill="#b3261e">Атакующий</text>
  <text x="1460" y="442" class="s" text-anchor="middle">сканер, бот</text>
  <line x1="1360" y1="420" x2="1300" y2="420" stroke="#b3261e" stroke-width="2.5"/>
  <line x1="1300" y1="225" x2="1300" y2="615" stroke="#b3261e" stroke-width="2.5"/>
  <circle cx="1330" cy="392" r="13" fill="#b3261e"/><text x="1330" y="397" class="n" text-anchor="middle">3</text>

  <rect class="box" x="840" y="150" width="400" height="150" rx="8" stroke="#9aa3ae"/>
  <text x="860" y="179" font-size="18" font-weight="700" fill="#1f2328">Хост 1</text>
  <text x="930" y="179" class="s">веб-сервер</text>
  <rect x="860" y="192" width="360" height="92" rx="6" fill="#f7f9fc" stroke="#c9ced6"/>
  <text x="876" y="216" class="l" fill="#1f2328">Агент HoneyForge</text>
  <rect class="chip" x="876" y="230" width="51" height="30" rx="5"/><text x="901.5" y="250" class="c" text-anchor="middle">SSH</text>
  <rect class="chip" x="935" y="230" width="60" height="30" rx="5"/><text x="965" y="250" class="c" text-anchor="middle">HTTP</text>
  <rect class="own" x="1003" y="230" width="129" height="30" rx="5"/><text x="1067.5" y="250" class="c" text-anchor="middle">своя ловушка</text>
  <line x1="660" y1="205" x2="838" y2="205" stroke="#2b5f9e" stroke-width="2.5" marker-end="url(#ab)"/>
  <line x1="840" y1="245" x2="662" y2="245" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#ag)"/>
  <line x1="1300" y1="225" x2="1242" y2="225" stroke="#b3261e" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect class="box" x="840" y="345" width="400" height="150" rx="8" stroke="#9aa3ae"/>
  <text x="860" y="374" font-size="18" font-weight="700" fill="#1f2328">Хост 2</text>
  <text x="930" y="374" class="s">АСУ ТП</text>
  <rect x="860" y="387" width="360" height="92" rx="6" fill="#f7f9fc" stroke="#c9ced6"/>
  <text x="876" y="411" class="l" fill="#1f2328">Агент HoneyForge</text>
  <rect class="chip" x="876" y="425" width="77" height="30" rx="5"/><text x="914.5" y="445" class="c" text-anchor="middle">Modbus</text>
  <rect class="chip" x="961" y="425" width="86" height="30" rx="5"/><text x="1004" y="445" class="c" text-anchor="middle">МЭК 104</text>
  <rect class="chip" x="1055" y="425" width="51" height="30" rx="5"/><text x="1080.5" y="445" class="c" text-anchor="middle">SSH</text>
  <line x1="660" y1="400" x2="838" y2="400" stroke="#2b5f9e" stroke-width="2.5" marker-end="url(#ab)"/>
  <line x1="840" y1="440" x2="662" y2="440" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#ag)"/>
  <line x1="1300" y1="420" x2="1242" y2="420" stroke="#b3261e" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect class="box" x="840" y="540" width="400" height="150" rx="8" stroke="#9aa3ae"/>
  <text x="860" y="569" font-size="18" font-weight="700" fill="#1f2328">Хост 3</text>
  <text x="930" y="569" class="s">база данных</text>
  <rect x="860" y="582" width="360" height="92" rx="6" fill="#f7f9fc" stroke="#c9ced6"/>
  <text x="876" y="606" class="l" fill="#1f2328">Агент HoneyForge</text>
  <rect class="chip" x="876" y="620" width="69" height="30" rx="5"/><text x="910.5" y="640" class="c" text-anchor="middle">Redis</text>
  <rect class="chip" x="953" y="620" width="60" height="30" rx="5"/><text x="983" y="640" class="c" text-anchor="middle">MQTT</text>
  <rect class="chip" x="1021" y="620" width="51" height="30" rx="5"/><text x="1046.5" y="640" class="c" text-anchor="middle">FTP</text>
  <rect class="chip" x="1080" y="620" width="77" height="30" rx="5"/><text x="1118.5" y="640" class="c" text-anchor="middle">tarpit</text>
  <line x1="660" y1="595" x2="838" y2="595" stroke="#2b5f9e" stroke-width="2.5" marker-end="url(#ab)"/>
  <line x1="840" y1="635" x2="662" y2="635" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#ag)"/>
  <line x1="1300" y1="615" x2="1242" y2="615" stroke="#b3261e" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- подписи стрелок у первого хоста -->
  <circle cx="700" cy="188" r="13" fill="#2b5f9e"/><text x="700" y="193" class="n" text-anchor="middle">2</text>
  <text x="722" y="194" class="l" fill="#2b5f9e">SSH</text>
  <circle cx="700" cy="270" r="13" fill="#2e7d32"/><text x="700" y="275" class="n" text-anchor="middle">4</text>
  <text x="722" y="276" class="l" fill="#2e7d32">события</text>

  <!-- Шаги -->
  <g font-size="17" fill="#1f2328">
    <circle cx="54" cy="772" r="13" fill="#2b5f9e"/><text x="54" y="777" class="n" text-anchor="middle">1</text>
    <text x="78" y="778">Оператор создаёт ловушки на сайте</text>
    <circle cx="54" cy="812" r="13" fill="#2b5f9e"/><text x="54" y="817" class="n" text-anchor="middle">2</text>
    <text x="78" y="818">Центр ставит агента на хост по SSH</text>
    <circle cx="560" cy="772" r="13" fill="#b3261e"/><text x="560" y="777" class="n" text-anchor="middle">3</text>
    <text x="584" y="778">Атакующий подключается к ловушке</text>

    <circle cx="560" cy="812" r="13" fill="#2e7d32"/><text x="560" y="817" class="n" text-anchor="middle">4</text>
    <text x="584" y="818">Агент шлёт события в центр — зашифрованно</text>
    <circle cx="1060" cy="772" r="13" fill="#2b5f9e"/><text x="1060" y="777" class="n" text-anchor="middle">5</text>
    <text x="1084" y="778">Оператор видит атаку на дашборде в реальном времени</text>
  </g>
</svg>
