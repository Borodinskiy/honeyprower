services:
  db:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-honeyforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-honeyforge}
      POSTGRES_DB: ${DB_NAME:-honeyforge}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Центр управления: сайт оператора + API + приём телеметрии.
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-honeyforge}
      DB_PASSWORD: ${DB_PASSWORD:-honeyforge}
      DB_NAME: ${DB_NAME:-honeyforge}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
    ports:
      - "${WEB_PORT:-8080}:8080"

  # Демо-ловушка low: SSH-баннер. Агент на Rust, конфиг едет с ним.
  ssh-trap:
    build:
      context: ./agent
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./deploy/agent-configs/ssh.json:/config/config.json:ro,Z
    ports:
      - "${SSH_TRAP_PORT:-2222}:2222"

  # Демо-ловушка medium: fake-FTP с захватом логинов/паролей.
  ftp-trap:
    build:
      context: ./agent
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./deploy/agent-configs/ftp.json:/config/config.json:ro,Z
    ports:
      - "${FTP_TRAP_PORT:-2121}:2121"

volumes:
  pgdata:
