services:
  db:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-honeyforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-honeyforge}
      POSTGRES_DB: ${DB_NAME:-honeyforge}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Центр управления: сайт оператора + API + приём телеметрии.
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-honeyforge}
      DB_PASSWORD: ${DB_PASSWORD:-honeyforge}
      DB_NAME: ${DB_NAME:-honeyforge}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      # Внешний адрес центра, который увидят агенты на удалённых серверах (нужен для деплоя по SSH).
      PUBLIC_URL: ${PUBLIC_URL:-}
    ports:
      - "${WEB_PORT:-8080}:8080"


volumes:
  pgdata:
